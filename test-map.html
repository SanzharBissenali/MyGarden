<!DOCTYPE html>
<html>
<head>
    <title>Map Test</title>
    <style>
        .display-map {
            width: 100%;
            margin: 1rem 0;
        }
        .map-container {
            position: relative;
            width: 100%;
            height: 500px;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        #maplibre-map {
            width: 100%;
            height: 100%;
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.css" />
</head>
<body>
    <h1>Map Test</h1>
    <div class="display-map">
        <div class="map-container">
            <div id="maplibre-map" data-center="[43.222,76.8512]" data-zoom="10"></div>
        </div>
        <div id="map-loading" class="loading-overlay">
            <div>Loading map...</div>
        </div>
    </div>
    
    <script src="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.js"></script>
    <script>
        const mapState = {
            map: null,
            markers: new Map()
        };
        
        const MARKER_STYLES = {
            default: { 
                color: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)", 
                borderColor: "#667eea",
                icon: "✨",
                shadowColor: "rgba(102, 126, 234, 0.4)"
            },
            important: { 
                color: "linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%)", 
                borderColor: "#ff6b6b",
                icon: "🔥",
                shadowColor: "rgba(255, 107, 107, 0.4)"
            },
            note: { 
                color: "linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%)", 
                borderColor: "#4ecdc4",
                icon: "💡",
                shadowColor: "rgba(78, 205, 196, 0.4)"
            },
            location: { 
                color: "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)", 
                borderColor: "#a8edea",
                icon: "📍",
                shadowColor: "rgba(168, 237, 234, 0.4)"
            }
        };
        
        function createMarkerElement(marker) {
            const el = document.createElement('div');
            const style = MARKER_STYLES[marker.category || 'default'];
            
            el.className = `map-marker category-${marker.category || 'default'}`;
            el.style.cssText = `
                cursor: pointer;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                color: white;
                background: ${style.color};
                border: 3px solid ${style.borderColor};
                box-shadow: 0 4px 8px ${style.shadowColor};
            `;
            el.innerHTML = style.icon;
            
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                console.log('Marker clicked:', marker.title);
                showMarkerPopup(marker);
            });
            
            return el;
        }
        
        function showMarkerPopup(marker) {
            if (!mapState.map) return;
            
            console.log('Showing popup for:', marker.title);
            
            const popupContent = `
                <div style="padding: 1rem; max-width: 300px;">
                    ${marker.image ? `<img src="${marker.image}" alt="${marker.title}" style="width: 100%; height: auto; border-radius: 4px; margin-bottom: 0.5rem;" />` : ""}
                    <h4 style="margin: 0 0 0.5rem 0;">${marker.title}</h4>
                    ${marker.description ? `<p style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">${marker.description}</p>` : ""}
                    <small>Category: ${marker.category || "default"}</small>
                </div>
            `;
            
            new maplibregl.Popup({ closeOnClick: true, maxWidth: "400px" })
                .setLngLat(marker.coordinates)
                .setHTML(popupContent)
                .addTo(mapState.map);
        }
        
        function addMarker(markerData) {
            console.log('Adding marker:', markerData.title);
            
            const el = createMarkerElement(markerData);
            const marker = new maplibregl.Marker(el)
                .setLngLat(markerData.coordinates)
                .addTo(mapState.map);
                
            marker._markerData = markerData;
            mapState.markers.set(markerData.id, marker);
        }
        
        async function loadMarkersFromFile() {
            try {
                console.log('Loading markers from /map-data.json');
                const response = await fetch('/map-data.json');
                if (!response.ok) {
                    throw new Error(`Failed to fetch map data: ${response.status}`);
                }
                const data = await response.json();
                console.log('Loaded markers:', data.markers);
                return data.markers || [];
            } catch (error) {
                console.warn('Failed to load markers from file:', error);
                return [];
            }
        }
        
        function hideLoadingOverlay() {
            const loadingOverlay = document.getElementById('map-loading');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        }
        
        async function initializeMap() {
            const mapContainer = document.getElementById('maplibre-map');
            if (!mapContainer || !window.maplibregl) return;
            
            try {
                console.log('Initializing map...');
                const centerData = mapContainer.getAttribute('data-center');
                const zoomData = mapContainer.getAttribute('data-zoom');
                
                const center = centerData ? JSON.parse(centerData) : [0, 0];
                const zoom = zoomData ? parseInt(zoomData) : 2;
                
                mapState.map = new maplibregl.Map({
                    container: 'maplibre-map',
                    style: {
                        version: 8,
                        name: "Custom Styled Map",
                        sources: {
                            "custom-tiles": {
                                type: "raster",
                                tiles: [
                                    "https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                                    "https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                                    "https://c.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",
                                    "https://d.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"
                                ],
                                tileSize: 256,
                                attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> © <a href="https://carto.com/attributions" target="_blank">CARTO</a>',
                            }
                        },
                        layers: [
                            {
                                id: "background",
                                type: "background",
                                paint: {
                                    "background-color": "#f5f5f5"
                                }
                            },
                            {
                                id: "custom-base",
                                type: "raster",
                                source: "custom-tiles",
                                minzoom: 0,
                                maxzoom: 22,
                                paint: {
                                    "raster-opacity": 1
                                }
                            }
                        ],
                    },
                    center: center,
                    zoom: zoom,
                    antialias: true,
                    attributionControl: true,
                });
                
                mapState.map.on('load', async () => {
                    console.log('Map loaded successfully');
                    hideLoadingOverlay();
                    
                    const markers = await loadMarkersFromFile();
                    console.log('Adding markers to map:', markers.length);
                    markers.forEach(addMarker);
                });
                
            } catch (error) {
                console.error('Failed to initialize map:', error);
                hideLoadingOverlay();
            }
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM loaded, initializing map...');
            await initializeMap();
        });
    </script>
</body>
</html>
